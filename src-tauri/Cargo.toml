[package]
name = "dsh-desktop"
version = "0.1.0"
description = "DSH Linux desktop shell (Tauri 2)"
authors = ["ctrlsea"]
license = "MIT"
repository = "https://github.com/ctrlsea/dsh-desktop-linux"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = "2"
ksni = "0.3"
png = "0.18"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
toml = "0.8"
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
zstd = "0.13"
base64 = "0.23"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = "z"
